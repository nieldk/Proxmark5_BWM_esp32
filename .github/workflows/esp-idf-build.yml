name: ESP-IDF Build and Package

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  release:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (IDF ${{ matrix.idf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # release assets come from the reference IDF only
          - idf: v5.5.2
            release: true
          - idf: v6.1
            release: false
    container:
      image: espressif/idf:${{ matrix.idf }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Allow git in container
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "Firmware version: $(git describe --always --tags --dirty)"

      - name: Setup ESP-IDF environment
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /opt/esp/idf/export.sh ]; then
            echo "ESP-IDF export script not found at /opt/esp/idf/export.sh"
            exit 1
          fi
          . /opt/esp/idf/export.sh
          command -v idf.py

      - name: Show ESP-IDF version
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py --version

      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c2
          idf.py build

      # Best-effort: list symbols in the closed-source BT controller lib that
      # sound CRC/frame-length related, for the zb_probe WazaBee port. No
      # public register map exists for this lib, so this is just a symbol
      # name grep, not disassembly. Never fails the build.
      - name: Scan BT controller lib for CRC/length-related symbols
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          . /opt/esp/idf/export.sh
          OUT="$GITHUB_WORKSPACE/btlib_symbols.txt"
          : > "$OUT"
          BTLIB_DIR="$IDF_PATH/components/bt/controller/lib_esp32c2/esp32c2-bt-lib"
          if [ ! -d "$BTLIB_DIR" ]; then
            echo "not found: $BTLIB_DIR" >> "$OUT"
          else
            for a in "$BTLIB_DIR"/*.a; do
              [ -f "$a" ] || continue
              echo "== $(basename "$a") ==" >> "$OUT"
              workdir=$(mktemp -d)
              (cd "$workdir" && ar x "$a")
              riscv32-esp-elf-nm --defined-only "$workdir"/*.o 2>/dev/null \
                | grep -iE "crc|maxlen|max_pdu|whiten|rxmaxbuf|hopc|ratecntl" >> "$OUT"
              rm -rf "$workdir"
              echo "" >> "$OUT"
            done
          fi
          if [ -f build/proxmark5_ble_wifi_module.map ]; then
            echo "== libble_app variant actually linked (from .map) ==" >> "$OUT"
            grep -i "libble_app" build/proxmark5_ble_wifi_module.map >> "$OUT"
          fi
          cat "$OUT"

      - name: Upload BT lib symbol scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: btlib-symbols-idf-${{ matrix.idf }}
          path: btlib_symbols.txt
          if-no-files-found: warn

      - name: Merge firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py merge-bin -o "$GITHUB_WORKSPACE/proxmark5_bwm_allinone.bin" -f raw

      - name: Prepare packaged files
        id: package
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v zip >/dev/null 2>&1; then
            apt-get update
            apt-get install -y zip
          fi

          mkdir -p dist

          ARTIFACT_PREFIX="proxmark5_bwm_${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          ARTIFACT_PREFIX="${ARTIFACT_PREFIX//\//_}"
          # artifact names must be unique per run
          if [ "${{ matrix.release }}" != "true" ]; then
            ARTIFACT_PREFIX="${ARTIFACT_PREFIX}_idf-${{ matrix.idf }}"
          fi

          MERGED_BIN=""
          if [ -f proxmark5_bwm_allinone.bin ]; then
            MERGED_BIN="proxmark5_bwm_allinone.bin"
          elif [ -f build/proxmark5_bwm_allinone.bin ]; then
            MERGED_BIN="build/proxmark5_bwm_allinone.bin"
          fi

          if [ -z "$MERGED_BIN" ]; then
            echo "Merged firmware not found in expected paths. Try merge again in this step."
            . /opt/esp/idf/export.sh
            idf.py merge-bin -o dist/proxmark5_bwm_allinone.bin -f raw

            if [ -f dist/proxmark5_bwm_allinone.bin ]; then
              MERGED_BIN="dist/proxmark5_bwm_allinone.bin"
            else
              echo "Merged firmware still not found. Checked: proxmark5_bwm_allinone.bin, build/proxmark5_bwm_allinone.bin, dist/proxmark5_bwm_allinone.bin"
              exit 1
            fi
          fi

          cp "$MERGED_BIN" dist/proxmark5_bwm_allinone.bin
          cp dist/proxmark5_bwm_allinone.bin proxmark5_bwm_allinone.bin

          if [ -f build/proxmark5_ble_wifi_module.bin ]; then cp build/proxmark5_ble_wifi_module.bin dist/; fi
          if [ -f build/proxmark5_ble_wifi_module.elf ]; then cp build/proxmark5_ble_wifi_module.elf dist/; fi
          if [ -f build/proxmark5_ble_wifi_module.map ]; then cp build/proxmark5_ble_wifi_module.map dist/; fi

          if [ -f build/bootloader/bootloader.bin ]; then cp build/bootloader/bootloader.bin dist/; fi
          if [ -f build/partition_table/partition-table.bin ]; then cp build/partition_table/partition-table.bin dist/; fi

          cp -f build/flasher_args.json dist/ || true
          cp -f build/flash_args dist/ || true
          cp -f build/flash_project_args dist/ || true

          (cd dist && zip -r "../${ARTIFACT_PREFIX}.zip" .)

          echo "artifact_prefix=${ARTIFACT_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_prefix }}
          path: dist/*
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release' && matrix.release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.artifact_prefix }}.zip
            dist/proxmark5_ble_wifi_module.bin
            dist/proxmark5_bwm_allinone.bin
